apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-registry/frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-rust-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-rust
  template:
    metadata:
      labels:
        app: backend-rust
    spec:
      containers:
      - name: backend-rust
        image: your-docker-registry/backend-rust:latest
        ports:
        - containerPort: 8080
        env:
        - name: AI_SERVICE_URL
          value: "http://ai-service-python:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-python-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service-python
  template:
    metadata:
      labels:
        app: ai-service-python
    spec:
      containers:
      - name: ai-service-python
        image: your-docker-registry/ai-service-python:latest
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secrets
              key: OPENAI_API_KEY
              optional: true
